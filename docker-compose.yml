services:
  # ==========================================================
  # Cassandra
  # ==========================================================
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    restart: always
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: IoTCluster
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - iot_network

    # Cassandra peut mettre 30-60s avant d'accepter les
    # connexions CQL.
    healthcheck:
       test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
       interval: 30s
       timeout: 30s
       retries: 10
       start_period: 90s

  # ==========================================================
  # Apache Kafka (KRaft)
  # ==========================================================
  kafka:
    # Version épinglée : évite qu'un `docker compose pull` ramène
    # une version majeure plus récente (ex: 4.x) qui casse la
    # négociation de protocole avec les clients kafka-python
    # configurés avec un api_version ancien (cf. bug NotCoordinatorError
    # observé au démarrage : "clamping to user-supplied 2.8" alors
    # que le broker tiré était en 4.3).
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://:29092,PLAINTEXT_EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - iot_network

    # Kafka (KRaft, node unique) n'a aucune dépendance fonctionnelle
    # sur Cassandra. Le lier à `service_healthy` de cassandra ne fait
    # que retarder son démarrage sans raison (cassandra met ~192s à
    # devenir healthy dans tes logs).
    # depends_on: (supprimé)

    # Healthcheck volontairement basé sur le listener TCP interne.
    # On évite kafka-topics.sh ici car cette commande reste bloquée
    # dans ta configuration actuelle alors que les applications
    # kafka-python communiquent correctement avec le broker.
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c "</dev/tcp/127.0.0.1/29092" || exit 1'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  # ==========================================================
  # Création des topics Kafka
  # Job ponctuel : exécuté une seule fois puis terminé.
  #
  # 6 topics
  # 6 partitions par topic
  # replication factor = 1 pour environnement Docker local
  # ==========================================================
  kafka-init-topics:
    image: apache/kafka:3.8.0
    container_name: kafka-init-topics
    restart: "no"

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - iot_network

    # Forme liste + `sh` (POSIX, toujours présent) plutôt que `bash -c '...'`.
    # Commande sur UNE SEULE ligne logique (pas de continuation `\`) :
    # des fins de ligne CRLF (fréquentes après un copier-coller sous
    # Windows/VMware) cassent silencieusement les continuations `\`
    # en shell, ce qui faisait exécuter kafka-topics.sh sans arguments
    # (-> affichage de l'aide) puis chaque option comme une commande
    # séparée introuvable.
    entrypoint:
      - /bin/sh
      - -c
      - |
        for topic in elevator_data rmg_data rtg_data sts_data straddle_data tractor_data; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 6 --replication-factor 1; done

  # ==========================================================
  # Création du schéma Cassandra (keyspace + tables)
  # Job ponctuel : exécuté une seule fois puis terminé.
  # Instancie CassandraClient (cassandra_client.py), qui crée le
  # keyspace et les 6 tables via `IF NOT EXISTS` -- donc sans danger
  # même si le job est relancé (ex: après un `docker compose up`
  # ultérieur, les tables existantes ne sont pas recréées).
  # ==========================================================
  cassandra-init:
    build:
      context: .
      dockerfile: kafka/Dockerfile
    container_name: cassandra-init
    restart: "no"
    command: ["python", "cassandra_init.py"]

    environment:
      CASSANDRA_HOST: cassandra

    depends_on:
      cassandra:
        condition: service_healthy

    networks:
      - iot_network

  # ==========================================================
  # NOTE : les services kafka-consumer-* (Kafka -> Cassandra) ont
  # été retirés. Cassandra est désormais la SOURCE des données
  # (remplie par excel_importer.py, puis par de vrais capteurs à
  # terme) : kafka_producer.py LIT Cassandra et rejoue vers Kafka.
  # Réécrire ces mêmes données dans Cassandra via un consumer
  # créait une boucle de rétroaction (la table source grossissait
  # indéfiniment). Le flux retenu est désormais :
  #     Cassandra (source) -> kafka-producer -> Kafka -> Spark -> PostgreSQL
  # ==========================================================

  # ==========================================================
  # Kafka Producer
  # ==========================================================
  kafka-producer:
    build:
      context: .
      dockerfile: kafka/Dockerfile
    container_name: kafka-producer
    restart: always
    command: ["python", "kafka_producer.py"]

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CASSANDRA_HOST: cassandra
      SEND_INTERVAL_SECONDS: 1
      MESSAGES_PER_EQUIPMENT: 8
    networks:
      - iot_network

    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully

  # ==========================================================
  # PostgreSQL
  # ==========================================================
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
      POSTGRES_DB: iot_realtime

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres/dwh_schema.sql:/docker-entrypoint-initdb.d/dwh_schema.sql

    networks:
      - iot_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_user -d iot_realtime"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================================
  # DWH ETL - exécute etl_hourly.sql toutes les heures
  # (agrégation horaire des tables _clean vers le data warehouse)
  # ==========================================================
  dwh-etl:
    image: postgres:16
    container_name: dwh-etl
    restart: always

    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: iot_realtime
      PGUSER: iot_user
      PGPASSWORD: iot_password

    volumes:
      - ./postgres/etl_hourly.sql:/etl_hourly.sql

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - iot_network

    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do psql -f /etl_hourly.sql; sleep 3600; done

  # ==========================================================
  # Spark - Elevator
  # ==========================================================
  spark-master-elevator:
    image: apache/spark:3.5.4-python3
    container_name: spark-master-elevator
    restart: always

    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.master.Master"
      ]

    ports:
      - "8081:8080"

    networks:
      - iot_network

  spark-worker-elevator:
    image: apache/spark:3.5.4-python3
    container_name: spark-worker-elevator
    restart: always

    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master-elevator:7077",
        "--cores",
        "2",
        "--memory",
        "2g"
      ]

    depends_on:
      - spark-master-elevator

    networks:
      - iot_network

  spark-app-elevator:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: spark-app-elevator
    restart: always

    environment:
      SPARK_MASTER: spark://spark-master-elevator:7077
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: iot_realtime
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
      EQUIPMENT_TYPE: elevator_data
      # Force le mode non-bufferisé de Python : sans ça, stdout est
      # bufferisé par bloc (pas ligne par ligne) dès qu'il n'est pas
      # attaché à un vrai terminal -- ce qui est le cas ici, puisque
      # spark-submit capture le stdout du driver Python pour Docker.
      # Résultat sans ce correctif : les print() de write_batch()
      # (ex: "[batch N] ... lignes valides") restent bloqués dans un
      # tampon mémoire et peuvent ne JAMAIS apparaître dans
      # `docker compose logs`, alors même que les écritures JDBC vers
      # Postgres, elles, fonctionnent normalement (non concernées par
      # ce buffering). Sans PYTHONUNBUFFERED, on peut donc croire à
      # tort que le job ne traite rien, alors qu'il tourne très bien.
      PYTHONUNBUFFERED: "1"

    depends_on:
      spark-worker-elevator:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully

    networks:
      - iot_network

